name: Publish Web App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - osiriso2026-cpu-friendly-eureka
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Export web production build
        run: |
          npx expo export --platform web
          node scripts/postprocess-web.js

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pay.mobilemarinedoc.com
          force_orphan: true
